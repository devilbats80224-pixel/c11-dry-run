name: C11 PR checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
concurrency:
  group: c11-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-checks:
    name: Portable checks (no full Worker replay)
    needs: hosted-worker
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out proposed code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned lint and type-check tools
        run: |
          python3 -m pip install ruff==0.17.6
          npm install --global pyright@1.1.414
      - name: Lint repository source
        run: ruff check .
      - name: Check Python types
        run: pyright --project pyrightconfig.json
      - name: Verify CI shell syntax
        run: |
          sh -n release_regressions/build_and_run_one_minute_ci.sh
          sh -n release_regressions/run_one_minute_ci.sh
          sh -n release_regressions/run_merged_main_ci.sh
          sh -n native_history_scheduler/run_integrated_cold_warm_review.sh
          sh -n native_history_scheduler/run_prior_invariants.sh
      - name: Reject tracked local-only files
        run: python3 -I -B release_regressions/check_public_tracked_files.py
      - name: Verify safe native replay failure diagnostics
        run: python3 -I -B hosted_worker/test_replay_public_diagnostics.py
      - name: Run portable regression tests
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            python3 -I -B release_regressions/run_required_cases.py --pr
          else
            python3 -I -B release_regressions/run_required_cases.py
          fi
      - name: Run offline OI20 handoff and native Freqtrade together
        env:
          FT_IMAGE: docker.io/freqtradeorg/freqtrade@sha256:956c03780934eeb93734a1f352e7e150b73becdafa3767a947a25ad2422fba2e
        run: |
          docker pull "$FT_IMAGE"
          replay() {
            docker run --rm --pull never --network none --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL \
              --security-opt=no-new-privileges --entrypoint python --workdir /freqtrade \
              -v "$PWD/release_regressions/public_freqtrade_replay.py:/freqtrade/c11_ci_fixture.py:ro" \
              -v "$PWD/release_regressions/oi20_contract:/freqtrade/oi20_contract:ro" \
              "$FT_IMAGE" -B /freqtrade/c11_ci_fixture.py "$@"
          }
          out=$(mktemp)
          replay | tee "$out"
          for case in blank partial stale; do
            grep -Fx "FREQTRADE_NATIVE_CONTRACT_PASS $case" "$out"
            grep -Fx "OI20_CANDIDATE_DELIVERED_TO_FREQTRADE $case" "$out"
          done
          if replay --case blank --inject drop-minute >"$out" 2>&1; then
            echo 'Expected the dropped-minute fixture to fail' >&2
            exit 1
          fi
          grep -F 'AssertionError: CLOSED_MINUTES_NOT_PERSISTED' "$out"
          if replay --case blank --inject direct-wide >"$out" 2>&1; then
            echo 'Expected the direct-wider-fetch fixture to fail' >&2
            exit 1
          fi
          grep -F 'AssertionError: UNEXPECTED_WIDER_WIRE' "$out"
          if replay --case blank --inject no-refill >"$out" 2>&1; then
            echo 'Expected the missing base refill fixture to fail' >&2
            exit 1
          fi
          grep -F 'AssertionError: MISSING_BASE_REFILL_REQUEST' "$out"
      - name: Test proposed C11 fallback code in native Freqtrade
        if: hashFiles('native_ccxt_projection/local_candle_refresh.py') != ''
        env:
          FT_IMAGE: docker.io/freqtradeorg/freqtrade@sha256:956c03780934eeb93734a1f352e7e150b73becdafa3767a947a25ad2422fba2e
        run: |
          for test in test_native_15m_fallback.py test_local_candle_refresh.py test_retain_warm_minutes.py test_native_projection_roundtrip.py; do
            docker run --rm --pull never --network none --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL \
              --security-opt=no-new-privileges --entrypoint python --workdir /freqtrade \
              -v "$PWD/native_ccxt_projection:/opt/c11-adapter:ro" \
              -v "$PWD/release_regressions/fallback_ci:/freqtrade/c11_fallback_ci:ro" \
              -e PYTHONPATH=/opt/c11-adapter:/freqtrade \
              "$FT_IMAGE" -B "/freqtrade/c11_fallback_ci/$test"
          done
      - name: Block runtime changes without native Worker evidence
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTED_WORKER_RESULT: ${{ needs.hosted-worker.result }}
          HOSTED_VERIFIED_MERGE_SHA: ${{ needs.hosted-worker.outputs.verified_merge_sha }}
        run: python3 -I -B release_regressions/check_pr_scope.py
  build-image:
    name: Build one disabled ARM64 C11 artifact
    if: github.event_name == 'pull_request'
    outputs:
      merge_sha: ${{ steps.exact_commit.outputs.merge_sha }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify version record rules
        run: python3 -I -B release_regressions/test_version_record.py
      - name: Require a traceable version record for this PR
        run: python3 -I -B release_regressions/check_version_record.py HEAD^1 HEAD^2
      - run: python3 -I -B hosted_worker/test_stage_archive_cache.py
      - run: python3 -I -B hosted_worker/test_history_rejection.py
      - run: sh hosted_worker/run-github-replay.sh "$RUNNER_TEMP/c11-worker" build "$RUNNER_TEMP/c11-artifact"
      - name: Bind proof to the same built merge
        id: exact_commit
        run: |
          exact="$(git rev-parse HEAD)"
          test "$exact" = "$(cat "$RUNNER_TEMP/c11-artifact/source.sha")"
          echo "merge_sha=$exact" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c11-arm64-replay-image
          path: ${{ runner.temp }}/c11-artifact
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
  hosted-case:
    needs: build-image
    name: C11 replay (${{ matrix.case }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: [warm, warm-missing-analysis, warm-unicode, warm-ready-basis, warm-divergent-fallback, early-roster-return, auto-stale, reviewed-partial, cached-blank, cached-stale, pinned-remote-blank, pinned-remote-stale, pinned-remote-no-listing, prepared-blank, prepared-stale, prepared-return, unseeded-no-listing, background-blank]
    steps:
      - name: Check out candidate merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c11-arm64-replay-image
          path: ${{ runner.temp }}/c11-artifact
      - name: Replay the same verified C11 artifact
        env:
          REPLAY_CASE: ${{ matrix.case }}
        run: sh hosted_worker/run-github-replay.sh "$RUNNER_TEMP/c11-worker" "$REPLAY_CASE" "$RUNNER_TEMP/c11-artifact"
  hosted-worker:
    name: ARM64 full C11 Worker replay
    needs: [build-image, hosted-case]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    outputs:
      verified_merge_sha: ${{ steps.verified.outputs.merge_sha }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every independently run ARM64 case
        id: verified
        env:
          CASE_RESULT: ${{ needs.hosted-case.result }}
          BUILT_SHA: ${{ needs.build-image.outputs.merge_sha }}
        run: |
          test "$CASE_RESULT" = success
          printf '%s\n' "$BUILT_SHA" | grep -Ex '[a-f0-9]{40}'
          echo "merge_sha=$BUILT_SHA" >> "$GITHUB_OUTPUT"
