name: C11 PR checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
concurrency:
  group: c11-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-checks:
    name: Portable checks (no full Worker replay)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out proposed code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify CI shell syntax
        run: |
          sh -n release_regressions/build_and_run_one_minute_ci.sh
          sh -n release_regressions/run_one_minute_ci.sh
          sh -n release_regressions/run_merged_main_ci.sh
          sh -n native_history_scheduler/run_integrated_cold_warm_review.sh
          sh -n native_history_scheduler/run_prior_invariants.sh
      - name: Reject tracked local-only files
        run: python3 -I -B release_regressions/check_public_tracked_files.py
      - name: Run portable regression tests
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            python3 -I -B release_regressions/run_required_cases.py --pr
          else
            python3 -I -B release_regressions/run_required_cases.py
          fi
      - name: Run offline OI20 handoff and native Freqtrade together
        env:
          FT_IMAGE: docker.io/freqtradeorg/freqtrade@sha256:956c03780934eeb93734a1f352e7e150b73becdafa3767a947a25ad2422fba2e
        run: |
          docker pull "$FT_IMAGE"
          replay() {
            docker run --rm --pull never --network none --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL \
              --security-opt=no-new-privileges --entrypoint python --workdir /freqtrade \
              -v "$PWD/release_regressions/public_freqtrade_replay.py:/freqtrade/c11_ci_fixture.py:ro" \
              -v "$PWD/release_regressions/oi20_contract:/freqtrade/oi20_contract:ro" \
              "$FT_IMAGE" -B /freqtrade/c11_ci_fixture.py "$@"
          }
          out=$(mktemp)
          replay | tee "$out"
          for case in blank partial stale; do
            grep -Fx "FREQTRADE_NATIVE_CONTRACT_PASS $case" "$out"
            grep -Fx "OI20_CANDIDATE_DELIVERED_TO_FREQTRADE $case" "$out"
          done
          if replay --case blank --inject drop-minute >"$out" 2>&1; then
            echo 'Expected the dropped-minute fixture to fail' >&2
            exit 1
          fi
          grep -F 'AssertionError: CLOSED_MINUTES_NOT_PERSISTED' "$out"
          if replay --case blank --inject direct-wide >"$out" 2>&1; then
            echo 'Expected the direct-wider-fetch fixture to fail' >&2
            exit 1
          fi
          grep -F 'AssertionError: UNEXPECTED_WIDER_WIRE' "$out"
          if replay --case blank --inject no-refill >"$out" 2>&1; then
            echo 'Expected the missing base refill fixture to fail' >&2
            exit 1
          fi
          grep -F 'AssertionError: MISSING_BASE_REFILL_REQUEST' "$out"
      - name: Test proposed C11 fallback code in native Freqtrade
        if: hashFiles('native_ccxt_projection/local_candle_refresh.py') != ''
        env:
          FT_IMAGE: docker.io/freqtradeorg/freqtrade@sha256:956c03780934eeb93734a1f352e7e150b73becdafa3767a947a25ad2422fba2e
        run: |
          for test in test_native_15m_fallback.py test_local_candle_refresh.py test_retain_warm_minutes.py; do
            docker run --rm --pull never --network none --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL \
              --security-opt=no-new-privileges --entrypoint python --workdir /freqtrade \
              -v "$PWD/native_ccxt_projection:/opt/c11-adapter:ro" \
              -v "$PWD/release_regressions/fallback_ci:/freqtrade/c11_fallback_ci:ro" \
              -e PYTHONPATH=/opt/c11-adapter:/freqtrade \
              "$FT_IMAGE" -B "/freqtrade/c11_fallback_ci/$test"
          done
      - name: Block runtime changes without native Worker evidence
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B release_regressions/check_pr_scope.py
